apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: heplify-server
  labels:
    app: heplify-server
{{ include "common.labels" . | indent 4 }}
spec:
  serviceName: heplify-server
  replicas: 1
  selector:
    matchLabels:
      app: heplify-server
  template:
    metadata:
      labels:
        app: heplify-server
    spec:
      {{- include "heplifyServer.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: heplify-server
          image: "{{ .Values.heplifyServer.image.registry }}/{{ .Values.heplifyServer.image.repository }}:{{ .Values.heplifyServer.image.tag }}"
          imagePullPolicy: {{ .Values.heplifyServer.image.pullPolicy }}
          args:
            - './heplify-server'
            - '-config'
            - '/etc/heplify-server.toml'
          env:
            - name: HEPLIFYSERVER_DBUSER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecretHomer }}
                  key: postgres-user
            - name: HEPLIFYSERVER_DBPASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgresql.auth.existingSecretHomer }}
                  key: postgres-password
          ports:
            - containerPort: 9060
              protocol: UDP
            - containerPort: 9096
              protocol: TCP
          resources: {}
          volumeMounts:
            - mountPath: /etc/heplify-server.toml
              name: heplify-server-conf
              subPath: heplify-server.toml
      volumes:
      - name: heplify-server-conf
        configMap:
          name: heplify-server-conf
          items:
          - key: heplify-server.toml
            path: heplify-server.toml
